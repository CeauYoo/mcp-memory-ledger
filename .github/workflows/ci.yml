name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Rust 1.95.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run full test tier
        run: ./scripts/test-tier.sh full

      - name: Check plan and status synchronization
        run: ./scripts/status-sync-check.sh

      - name: Verify installed-binary offline memory workflow
        run: python3 scripts/local-memory-smoke.py --binary target/debug/agent_llm_mm --output target/reports/local-memory-smoke

      - name: Verify feedback and experience proxy workflow
        run: |
          python3 scripts/evaluate-memory-loop.py --binary target/debug/agent_llm_mm --output target/reports/memory-evaluation
          python3 -m unittest discover -s tests/fixtures/memory-evaluation -p 'test_*.py'
          python3 scripts/temporal-scope-export-smoke.py --binary target/debug/agent_llm_mm --output target/reports/temporal-scope-export

      - name: Test synthetic native-host probe contracts offline
        run: python -B -m unittest discover -s tests -p 'test_codex_native_host_probe.py' -v

      - name: Test dashboard frontend contracts
        run: node --test tests/dashboard/frontend.test.mjs

      - name: Test portable archive safety contracts
        shell: bash
        run: python -m unittest discover -s tests -p 'test_portable_package.py' -v

      - name: Verify local core and bridges without Rust on child PATH (Unix)
        run: python3 scripts/verify-local-core.py --binary "$(pwd)/target/debug/agent_llm_mm" --output "$(pwd)/target/core-verification"

      - name: Verify native Codex task context with loopback Responses fixture
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          asset=codex-package-x86_64-unknown-linux-musl.tar.gz
          package="$RUNNER_TEMP/codex-0.159.2"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --proto '=https' --max-time 180 \
            "https://github.com/openai/codex/releases/download/rust-v0.159.2/$asset" \
            --output "$archive"
          printf '%s  %s\n' '9e2d29a713b94478b240dec2f10e11324cd05fad76dc43e7c639bdf8a1337a6b' "$archive" | sha256sum --check --strict
          mkdir "$package"
          tar -xzf "$archive" -C "$package"
          mkdir -p target/reports
          python3 scripts/probe-codex-native-host.py \
            --codex "$package/bin/codex" \
            --ledger "$(pwd)/target/debug/agent_llm_mm" \
            --output "$(pwd)/target/reports/codex-native-host.json" \
            --allow-synthetic-local-turn

      - name: Prepare Node for owner-login browser QA
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify owner-login page in real Chrome with isolated Rust core
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$chrome"
          node scripts/dashboard-admin-browser-check.mjs --chrome "$chrome" --binary "$(pwd)/target/debug/agent_llm_mm" --output "$RUNNER_TEMP/admin-browser-verification"

      - name: Test local-core verifier safety contracts
        run: python3 -B -m unittest discover -s tests -p 'test_local_core_verifier.py' -v

      - name: Test Windows named-pipe verifier safety contracts offline
        run: python3 -B -m unittest discover -s tests -p 'test_windows_local_core_verifier.py' -v

      - name: Test staged experience acceptance and loopback live monitor offline
        run: python -B -m unittest discover -s tools/experience -p 'test_*.py' -v

      - name: Build exact-source portable archive and verify without Rust
        shell: bash
        run: |
          python scripts/portable-package.py build --candidate local-mvp-ci-rc.1 --source-ref HEAD --output target/portable-package --target-dir target
          shopt -s nullglob
          archives=(target/portable-package/*.tar.gz target/portable-package/*.zip)
          receipts=(target/portable-package/*.build.json)
          test "${#archives[@]}" -eq 1
          test "${#receipts[@]}" -eq 1
          python scripts/portable-package.py verify --archive "${archives[0]}" --receipt "${receipts[0]}" --expected-commit "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse 'HEAD^{tree}')" --output target/portable-package-verify

      - name: Preserve synthetic candidate verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-core-and-package-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            target/core-verification/summary.json
            target/reports/codex-native-host.json
            target/portable-package-verify/summary.json
            target/portable-package-verify/SHA256SUMS
            target/portable-package-verify/local-core/summary.json
            ${{ runner.temp }}/admin-browser-verification/report.json
            ${{ runner.temp }}/admin-browser-verification/cleanup.json
            ${{ runner.temp }}/admin-browser-verification/*.png

  windows-runtime:
    name: Windows native runtime / Rust 1.95.0
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pinned toolchain
        run: rustc --version --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test native memory and lifecycle runtime
        run: cargo test --lib --test task_ledger --test codex_context_adapter --test workspace_registry --test workspace_client_config --test workspace_adoption --test mcp_session_policy --test local_core_cli --test local_core --test sqlite_lifecycle --test database_backup --test sqlite_store --test correction_atomicity --test feedback_provenance --test feedback_candidates --test experience_workflow --test experience_use_feedback --test dashboard_admin --test indexed_text_recall --test temporal_metadata --test sqlite_temporal_store --test reflection_scope_history --test scoped_ledger_export --test schema6_migration --test schema7_migration --test self_model_versions --test version_api --test context_diagnostics --test caller_operation_budget --test mcp_stdio --test native_model_protocols --test openai_compatible_model --test provider_config --test dashboard_config --test dashboard_recorder --test dashboard_projection --test dashboard_http
      - name: Test bounded provider certification with offline fixtures
        run: cargo test --features release-tools --test provider_live_certification
      - name: Verify installed-binary offline memory workflow
        run: python scripts/local-memory-smoke.py --binary target/debug/agent_llm_mm.exe --output target/reports/local-memory-smoke
      - name: Verify feedback and experience proxy workflow
        run: python scripts/evaluate-memory-loop.py --binary target/debug/agent_llm_mm.exe --output target/reports/memory-evaluation
      - name: Test offline evaluation fixtures
        run: python -m unittest discover -s tests/fixtures/memory-evaluation -p "test_*.py"
      - name: Verify temporal scope and export workflow
        run: python scripts/temporal-scope-export-smoke.py --binary target/debug/agent_llm_mm.exe --output target/reports/temporal-scope-export

      - name: Verify actual PowerShell wrapper behavior
        run: python scripts/test-windows-wrapper.py

      - name: Test synthetic native-host probe contracts offline
        run: python -B -m unittest discover -s tests -p 'test_codex_native_host_probe.py' -v

      - name: Test dashboard frontend contracts
        run: node --test tests/dashboard/frontend.test.mjs

      - name: Test portable archive safety contracts
        shell: bash
        run: python -m unittest discover -s tests -p 'test_portable_package.py' -v

      - name: Test Windows named-pipe verifier safety contracts
        run: python -B -m unittest discover -s tests -p 'test_windows_local_core_verifier.py' -v

      - name: Test staged experience acceptance and loopback live monitor offline
        run: python -B -m unittest discover -s tools/experience -p 'test_*.py' -v

      - name: Build exact-source portable archive and verify without Rust
        shell: bash
        run: |
          python scripts/portable-package.py build --candidate local-mvp-ci-rc.1 --source-ref HEAD --output target/portable-package --target-dir target
          shopt -s nullglob
          archives=(target/portable-package/*.tar.gz target/portable-package/*.zip)
          receipts=(target/portable-package/*.build.json)
          test "${#archives[@]}" -eq 1
          test "${#receipts[@]}" -eq 1
          python scripts/portable-package.py verify --archive "${archives[0]}" --receipt "${receipts[0]}" --expected-commit "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse 'HEAD^{tree}')" --output target/portable-package-verify

      - name: Preserve synthetic Windows candidate verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-core-and-package-windows
          if-no-files-found: warn
          path: |
            target/portable-package-verify/summary.json
            target/portable-package-verify/SHA256SUMS
            target/portable-package-verify/local-core/summary.json
