# Current source-build stdio example; replace every absolute path.
# First build agent_llm_mm, prepare an explicit mock/local configuration,
# then run init (new DB only) and doctor --read-only with that same config.
# See docs/quickstart.md and docs/local-mcp-integration-2026-03-26.md.
[mcp_servers.memory-ledger]
command = "/absolute/path/mcp-memory-ledger/target/debug/agent_llm_mm"
args = ["serve"]
env = { AGENT_LLM_MM_CONFIG = "/absolute/path/ledger-demo.toml" }

# Windows: command = "C:/code/mcp-memory-ledger/target/debug/agent_llm_mm.exe"
# Release build: use target/release/agent_llm_mm (or .exe) instead.
# database_url inside the TOML must also use an explicit absolute path.
# Do not put provider secrets in this tracked example.

# Alternative macOS wrapper, in a separately named server entry:
# [mcp_servers.memory-ledger-wrapper]
# command = "/absolute/path/mcp-memory-ledger/scripts/agent-llm-mm.sh"
# args = ["serve"]
# env = { AGENT_LLM_MM_CONFIG = "/absolute/path/ledger-demo.toml" }
# Enable only the entry you intend to use.

# Native OpenAI Responses / Anthropic Messages may be selected in the referenced
# AGENT_LLM_MM_CONFIG file; see examples/agent-llm-mm.example.toml for sections.
# Set OPENAI_API_KEY or ANTHROPIC_API_KEY in the server's inherited environment
# when using those example api_key_env names. Do not put real keys in this file.
# Native protocol support is offline-tested MVP capability, not live certification.
