# General entry config for `agent_llm_mm`.
#
# Pick the profile that matches the data you are about to touch:
# - examples/agent-llm-mm.dev.example.toml: local development and tests
# - examples/agent-llm-mm.prod-local.example.toml: formal local data
# - examples/agent-llm-mm.demo.example.toml: deterministic self-revision demo
# - examples/agent-llm-mm.openrouter.example.toml: OpenRouter via OpenAI-compatible transport
#
# `bootstrap-local` copies the dev example as the safest first-run template.
# Relative bootstrap-local targets are resolved from the repository root.
# It does not create secrets, overwrite local config, run doctor, or start serve.
#
# Do not reuse one database_url for formal data, manual tests, and demos.

transport = "stdio"
database_url = "sqlite:///absolute/path/to/agent-llm-mm.local.sqlite"

[model]
provider = "mock"

# OpenRouter is an optional supported provider profile. Prefer copying
# examples/agent-llm-mm.openrouter.example.toml instead of mixing provider
# profiles in one config. Keep secrets in AGENT_LLM_MM_OPENROUTER_API_KEY.
# Config examples alone are not live evidence; run
# ./scripts/provider-live-certification-run.sh --live [config_path] [evidence_root]
# when you need bounded provider preflight evidence.
#
# [model]
# provider = "openrouter"
#
# [model.openrouter]
# model = "openai/gpt-oss-120b"
# api_key_env = "AGENT_LLM_MM_OPENROUTER_API_KEY"

[dashboard]
enabled = false
host = "127.0.0.1"
port = 8787
base_path = "/"
event_capacity = 2000
sse_enabled = true
open_browser = false
required = false

[daemon]
enabled = false
poll_interval_ms = 60000
max_concurrent_tasks = 1

# Native protocol alternatives. Replace [model] above and select ONE section.
# Both adapters are offline-tested MVP support, not live-certified providers.
# provider-live-certification-run currently supports chat-completions only.
# base_url is an API root; /responses or /messages is appended by the adapter.
# max_tokens defaults to 2048 and must be positive. timeout_ms defaults to 30000
# and must be positive. Omit temperature for provider/model defaults.
#
# [model]
# provider = "openai-responses"
# [model.openai_responses]
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# model = "replace-with-supported-model"
# max_tokens = 2048
# timeout_ms = 30000
# temperature = 0.5 # optional, 0..=2; omit for models that do not support it
#
# [model]
# provider = "anthropic"
# [model.anthropic]
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# model = "replace-with-supported-model"
# max_tokens = 2048
# timeout_ms = 30000
# temperature = 0.5 # optional, 0..=1
